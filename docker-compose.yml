services:
  postgres:
    image: postgres:16-alpine
    container_name: aria-community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aria_community
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aria_community"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
